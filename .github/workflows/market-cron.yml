name: Destrade Pro — Autonomous Market Cron

on:
  schedule:
    # Run every 5 minutes Monday to Friday from 03:30 UTC to 10:30 UTC (09:00 AM to 04:00 PM IST)
    - cron: '*/5 3-10 * * 1-5'
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: destrade-market-cron
  cancel-in-progress: false

jobs:
  market-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Cloud Market Worker Loop
        run: node cloud-cron.js

